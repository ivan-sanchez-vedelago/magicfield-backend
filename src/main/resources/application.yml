server:
  port: ${PORT:8080}

spring:

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC
        format_sql: false

  jackson:
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  admin-email: ${APP_ADMIN_EMAIL}
  email-from: ${APP_EMAIL_FROM}

firebase:
  bucket: ${FIREBASE_BUCKET}
  service:
    account:
      path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
      json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
      
resend:
  api-key: ${RESEND_API_KEY:}

logging:
  level:
    root: INFO
    com.magicfield: DEBUG
    org.springframework.mail: DEBUG

jwt:
  secret: ${JWT_SECRET:MagicFieldSecretKeyChangeThisInProductionAtLeast32CharactersLong}
  expiration: ${JWT_EXPIRATION:86400000}

# --- Observability ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: magicfield-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

# OpenTelemetry (set via env vars in Railway)
# OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp-gateway-prod-sa-east-1.grafana.net/otlp
# OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic <base64>
# OTEL_SERVICE_NAME=magicfield-backend

umami:
  api:
    url: ${UMAMI_API_URL:https://api.umami.is/v1}
    key: ${UMAMI_API_KEY:}
  website:
    id: ${UMAMI_WEBSITE_ID:}